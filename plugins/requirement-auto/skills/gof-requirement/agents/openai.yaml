interface:
  display_name: "GOFCN 需求自动化"
  short_description: "通过插件内飞书 SDK 桥追加进度表并以完整 XLSX 验收，生成 CSV、保存 CLS 草稿及导入脚本"
  default_prompt: "Use $gof-requirement for the full flow: progress sheet, CSV, unpublished CLS draft with script import, copyable group message. Don't ask about scope. Ask only for missing inputs, show one complete plan, and once I approve it run everything without further questions unless blocked."
policy:
  allow_implicit_invocation: true
